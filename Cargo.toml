[package]
name = "ambler"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Scaffolds and checks Ambler projects"

[workspace]
members = [".", "xtask"]

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
