[package]
name = "amble"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Scaffolds and checks Ambler projects"

[dependencies]
oxc_allocator = "0.75.0"
oxc_ast = "0.75.0"
oxc_parser = "0.75.0"
oxc_span = "0.75.0"
proc-macro2 = { version = "1", features = ["span-locations"] }
rustpython-parser = "0.4"
syn = { version = "2", features = ["full", "visit"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
