[project]
name = "{{project}}"
version = "0.1.0"
description = "An Ambler project: a program built as walks of small, tested nodes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMatchNotExhaustive = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv.sources]
ambler = { git = "https://github.com/argenkiwi/ambler-py" }

[dependency-groups]
dev = [
    "ambler",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
